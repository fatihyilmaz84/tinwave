[package]
name = "tinwave-desktop"
description = "Tinwave desktop app: Qt 6 Quick/QML window shell over thin CXX-Qt view models (ADR 0008)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }

[build-dependencies]
cxx-qt-build = { workspace = true }

# Not `workspace = true`: the `#[cxx_qt::bridge]` macro expands to `unsafe`/`export_name` items, so the workspace's
# `forbid` cannot apply (ADR 0008). `deny` keeps every other module free of `unsafe`; only bridge modules and the
# documented FFI call sites carry `#[allow(unsafe_code)]`, with a SAFETY comment per unsafe block.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
