[package]
name = "tinwave-desktop"
description = "Tinwave desktop app: Qt 6 Quick/QML window shell over thin CXX-Qt view models (ADR 0008)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# `image-stress` is a second binary; `cargo run -p tinwave-desktop` must keep starting the app.
default-run = "tinwave-desktop"

[dependencies]
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }

# Windows platform services (src/platform/windows.rs, the only unsafe of the platform layer). Only the Win32 areas it
# calls: SystemParametersInfo + window subclassing (WindowsAndMessaging), high contrast (Accessibility), Mica (Dwm,
# Controls for MARGINS), the transparency registry value, uxtheme loading, RtlGetVersion (Wdk) for the build number.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }

# Dev-only teardown stress target for the artwork image provider (tools/stress/, ADR 0008 rule 6). Not packaged.
[[bin]]
name = "image-stress"
path = "tools/stress/main.rs"

[build-dependencies]
cxx-qt-build = { workspace = true }

# Not `workspace = true`: the `#[cxx_qt::bridge]` macro expands to `unsafe`/`export_name` items, so the workspace's
# `forbid` cannot apply (ADR 0008). `deny` keeps every other module free of `unsafe`; only bridge modules and the
# documented FFI call sites carry `#[allow(unsafe_code)]`, with a SAFETY comment per unsafe block.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"
