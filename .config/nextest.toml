# cargo-nextest settings (docs/rules/testing.md). Only overrides live here; everything else is
# nextest's default (a test over 60 s is reported as SLOW, never killed).

# Hard backstop for the storage growth binary (crates/tinwave-db/tests/storage_growth.rs). Its
# 90-day run is among the longest tests in the workspace (the signal-wipe statement-count test, T-0073,
# is about as long under load; T-0074 makes it cheaper): about 15 s on an idle machine, 70 to 110 s
# measured with the machine saturated by two parallel workspace runs plus other agents. Killed
# after 5 x 60 s = 300 s: about 20x the idle time and almost 3x the worst measured, so a loaded
# machine never trips it, while a deadlock the harness's own 60 s barrier assert cannot see
# (writer join, a lock) cannot hold a run forever. A longer test added to this binary (the
# 5-year run with compaction, T-0029) must raise N.
[[profile.default.overrides]]
filter = 'binary(storage_growth)'
slow-timeout = { period = "60s", terminate-after = 5 }

# Backstop for the playback binaries (T-0066 review-2). Several playback tests drive the engine with
# spin-and-sleep loops whose worst case under a regression (a lost output, a reopen that never comes)
# is minutes to hours. The slowest measured under a saturated machine is ~30 s (exclusive_reopen,
# controller_exclusive at 40 parallel copies), so 5 x 60 s = 300 s never trips on load but turns a
# hang into a failure.
[[profile.default.overrides]]
filter = 'package(tinwave-playback)'
slow-timeout = { period = "60s", terminate-after = 5 }
