[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# GPL / AGPL / LGPL and anything not listed above is denied by default.

# MPL-2.0 is file-level copyleft. PO decision D-0003 (ADR 0005) allows it ONLY for Symphonia, used
# unmodified (fixes go upstream or around it in our own code). No global MPL-2.0 allow: any other
# MPL-2.0 crate is still rejected. A new symphonia-* crate needs an entry here on purpose.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-bundle-flac"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-bundle-mp3"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-codec-aac"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-codec-adpcm"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-codec-alac"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-codec-pcm"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-codec-vorbis"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-common"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-core"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-format-isomp4"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-format-mkv"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-format-ogg"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-format-riff"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "symphonia-metadata"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
