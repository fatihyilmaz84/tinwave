[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]
# Spike prototypes live outside the workspace and never join it.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tinwave-core = { path = "crates/tinwave-core", version = "0.1.0" }
tinwave-signals = { path = "crates/tinwave-signals", version = "0.1.0" }
# Dev-only counting allocator; never a runtime dependency.
tinwave-test-alloc = { path = "crates/tinwave-test-alloc", version = "0.1.0" }
arc-swap = "1"
# Pure-Rust build: no C compiler step for a hash that runs once per device change.
blake3 = { version = "1", default-features = false, features = ["pure"] }
# Build-time C/C++ compiler driver for the vendored Signalsmith Stretch shim (tinwave-playback). MIT OR Apache-2.0.
cc = "1"
crossbeam-channel = "0.5"
# Generic audio output (macOS/Linux, Windows fallback). Apache-2.0.
cpal = "0.18"
# Rust <-> Qt bridge, Cargo-driven, Qt linked dynamically (ADR 0008). Only apps/tinwave-desktop uses these.
cxx = "1"
cxx-qt = "0.10"
cxx-qt-build = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
getrandom = "0.4"
# Dev-only (storage_growth speed check): per-thread CPU time, a safe API (the workspace forbids unsafe). MIT/Apache-2.0.
cpu-time = "1.0"
# Dev-only (benchmarks). No plotting, rayon or HTML report: smaller dependency tree.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# Bundled SQLite (public domain, compiled in): no system SQLite, same engine on every OS.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "cache"] }
rtrb = "0.4"
# Sample-rate conversion in the decoder thread (ADR 0005 decision 5). MIT OR Apache-2.0, pure Rust.
rubato = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MPL-2.0: allowed only for symphonia* crates (deny.toml exceptions, ADR 0005). Never patched in-tree.
symphonia = { version = "0.6", features = ["aac", "alac", "isomp4", "mp3", "aiff"] }
tempfile = "3"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["serde"] }
# Direct WASAPI output on Windows (shared + exclusive, event driven). MIT; safe wrapper over `windows`.
wasapi = "0.26"
# Windows-only (cfg(windows) in the crates that use it); each crate lists the Win32 features it needs.
windows = "0.62"
# The `#[implement]` macro expands to paths in this crate, so it must be a direct dependency.
windows-core = "0.62"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
