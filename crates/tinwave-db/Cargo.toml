[package]
name = "tinwave-db"
description = "Tinwave SQLite layer: the migration runner, signals.db and its batched SignalWriter. The only crate that writes SQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `SignalWiper::connection_for_tests`: a raw `rusqlite::Connection`, for the integration tests that
# count statements. Off by default and never enabled by a dependent crate: only the self
# dev-dependency below turns it on, for this crate's own tests and benches. The UI never touches SQLite.
test-support = []

[dependencies]
tinwave-core = { workspace = true }
tinwave-signals = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
cpu-time = { workspace = true }
criterion = { workspace = true }
# `Connection::trace_v2`: the wipe tests count the statements a wipe runs.
rusqlite = { workspace = true, features = ["trace"] }
tempfile = { workspace = true }
# This crate with `test-support`, so that `cargo test -p tinwave-db` (and the benches) see the
# raw connection and a plain build does not.
tinwave-db = { path = ".", features = ["test-support"] }

[[bench]]
name = "write_batch"
harness = false

[[bench]]
name = "writer_rss"
harness = false

[lints]
workspace = true
