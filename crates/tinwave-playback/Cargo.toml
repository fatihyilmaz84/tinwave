[package]
name = "tinwave-playback"
description = "Tinwave playback engine core: Symphonia decoder thread, lock-free ring, real-time renderer. No OS output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tinwave-core = { workspace = true }
rtrb = { workspace = true }
symphonia = { workspace = true }
thiserror = { workspace = true }

# Not `workspace = true`: the workspace forbids unsafe code, but the allocation-counting test
# (tests/rt_alloc.rs) must implement `GlobalAlloc`. The library itself keeps
# `#![forbid(unsafe_code)]` in src/lib.rs; only that one test binary opts in.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
