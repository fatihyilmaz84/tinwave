# T-0002 spike (throwaway). Standalone: NOT part of the main workspace.
[package]
name = "t0002-cxx-qt"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
# Spike-only process metrics (RSS, CPU time, process age). Not a Tinwave decision.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[build-dependencies]
cxx-qt-build = { version = "0.10" }

[profile.release]
debug = false
