[package]
name = "t0003-audio-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway spike: excluded from the Tinwave workspace.
[workspace]

[dependencies]
symphonia = { version = "0.6", features = ["all"] }
cpal = "0.18"
wasapi = "0.26"
rtrb = "0.4"
hound = "3.5"
flacenc = "0.5"
mp3lame-encoder = "0.2"
alac-encoder = "0.3"
rubato = "5"
audioadapter = "5"
audioadapter-buffers = "5"
anyhow = "1"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-all"] }
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus",
  "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_Storage_FileSystem",
] }

[profile.release]
debug = false
